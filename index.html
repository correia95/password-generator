    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "FAQPage",
        "mainEntity": [
          {
            "@type": "Question",
            "name": "Are these passwords generated securely?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Yes. Every random choice comes from the browser's crypto.getRandomValues with rejection sampling, so there is no modulo bias. Generation happens entirely on your device with no network request."
            }
          },
          {
            "@type": "Question",
            "name": "How long should a password be?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "For a random password, aim for at least 16 characters, or 20 if you can. That puts the entropy above what an attacker with fast offline hardware can brute-force. Length matters far more than adding exotic symbols."
            }
          },
          {
            "@type": "Question",
            "name": "What does 'avoid look-alikes' do?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "It removes characters that are easy to confuse when typing: zero and capital O, and the number one, lowercase L and capital I. It costs a small amount of entropy, which you can recover by adding a character or two of length."
            }
          },
          {
            "@type": "Question",
            "name": "Should I remember the generated password?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "No. Put it in a password manager. The recommended approach is a unique random password for every site, stored in a manager that you unlock with one strong passphrase you actually memorise."
            }
          }
        ]
      }
    </script>
